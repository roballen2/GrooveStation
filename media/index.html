<div id="lightbox-overlay" class="lightbox-overlay" onclick="closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()" aria-label="Close">&times;</button>
  <img id="lightbox-img" src="" alt="">
</div>
<script>
document.addEventListener('click', function(e) {
  var trigger = e.target.closest('[data-lightbox]');
  if (trigger) {
    e.preventDefault();
    var img = trigger.querySelector('img');
    document.getElementById('lightbox-img').src = trigger.getAttribute('href') || img.src;
    document.getElementById('lightbox-overlay').classList.add('is-open');
  }
});
function closeLightbox() {
  document.getElementById('lightbox-overlay').classList.remove('is-open');
}
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeLightbox();
});
</script>
